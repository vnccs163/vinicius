<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas Fáceis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Angelic+War&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            background-color: #F0C2A6;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border-radius: 0 0 8px 8px;
        }

        /* Aplicação da fonte Angelic War no título do cabeçalho */
        header h1 {
            font-family: 'Angelic War', cursive, sans-serif;
            font-size: 2.5rem; /* Aumentado ligeiramente para destacar a fonte */
            color: #8B3A00; 
            margin-bottom: 8px;
        }

        header p {
            font-family: 'Angelic War', cursive, sans-serif; /* Caso queira aplicar ao subtítulo também */
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 16px;
            background-color: #ffffff;
            border-radius: 8px;
        }

        main h2 {
            color: #4A6B32; 
        }
    </style>
</head>

        <h1>receitas.com.br</h1>
        <p>Aqui faremos receitas práticas e rápidas</p
